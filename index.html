<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoBroke</title>
    <script>
      // Paint the right theme before first render: the saved choice, else the
      // system scheme. Mirrors src/lib/theme.ts, which owns theming after boot.
      try {
        var t = localStorage.getItem("nobroke_theme_v1");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta
      name="description"
      content="NoBroke is wealth management for people who are still building. Track everything you own, plan every goal, and grow it all in one portfolio."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Pre-JS fallback only: applyTheme() re-syncs these from the live
         --bg token, so an explicit in-app theme choice also recolours the
         browser chrome. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0B" />
    <meta property="og:title" content="NoBroke" />
    <meta property="og:description" content="Track everything you own, plan every goal, and grow it all in one simple portfolio." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
